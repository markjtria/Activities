<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Champions - View</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    .tracking {
      letter-spacing: 2px;
    }

    .slant {
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    }
  </style>
</head>

<body class="bg-black text-white">
  <nav class="navbar bg-black border-bottom border-danger py-3">
    <div class="container">
      <a class="navbar-brand fw-bold text-white fs-3 text-uppercase tracking" href="index.html">
        <span class="d-inline-block bg-danger me-2 align-middle" style="width: 8px; height: 26px;"></span>Champions
      </a>
      <a id="back" class="btn btn-danger rounded-0 slant px-4 text-uppercase tracking" href="index.html">&larr; Back</a>
    </div>
  </nav>

  <div class="container py-4" style="max-width: 800px;" id="details">
    <div class="text-center py-5">Loading...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    var elDetails = document.getElementById("details");
    var elBack = document.getElementById("back");

    const urlParams = new URLSearchParams(window.location.search);
    var id = urlParams.get('id');
    var page = urlParams.get('page');
    if (page == null) page = 1;

    if (id == null) {
      window.location.href = "index.html";
    }

    elBack.href = "index.html?page=" + page;

    const getChampion = async () => {
      try {
        const versionResponse = await fetch('https://ddragon.leagueoflegends.com/api/versions.json');
        const versions = await versionResponse.json();
        const version = versions[0];

        const response = await fetch('https://ddragon.leagueoflegends.com/cdn/' + version + '/data/en_US/champion/' + id + '.json');
        const result = await response.json();
        const c = result.data[id];

        var splash = 'https://ddragon.leagueoflegends.com/cdn/img/champion/splash/' + id + '_0.jpg';

        var roles = '';
        for (var i = 0; i < c.tags.length; i++) {
          roles += '<span class="badge bg-danger me-1">' + c.tags[i] + '</span>';
        }

        var abilities = `
          <div class="d-flex mb-3">
            <img class="me-3 border border-danger flex-shrink-0" width="48" height="48" src="https://ddragon.leagueoflegends.com/cdn/${version}/img/passive/${c.passive.image.full}" alt="">
            <div><b>Passive: ${c.passive.name}</b><div class="text-secondary small">${c.passive.description}</div></div>
          </div>`;
        var keys = ['Q', 'W', 'E', 'R'];
        for (var i = 0; i < c.spells.length; i++) {
          var s = c.spells[i];
          abilities += `
            <div class="d-flex mb-3">
              <img class="me-3 border border-danger flex-shrink-0" width="48" height="48" src="https://ddragon.leagueoflegends.com/cdn/${version}/img/spell/${s.image.full}" alt="">
              <div><b>${keys[i]}: ${s.name}</b><div class="text-secondary small">${s.description}</div></div>
            </div>`;
        }

        elDetails.innerHTML = `
          <img class="img-fluid border border-danger border-2 mb-4" src="${splash}" alt="${c.name}">
          <h1 class="mb-0">${c.name}</h1>
          <div class="text-danger text-capitalize mb-2">${c.title}</div>
          <div>${roles}</div>

          <h4 class="text-danger border-bottom border-danger pb-2 mt-4 mb-3">Lore</h4>
          <p>${c.lore}</p>

          <h4 class="text-danger border-bottom border-danger pb-2 mt-4 mb-3">Base stats</h4>
          <ul class="list-group">
            <li class="list-group-item bg-dark d-flex justify-content-between"><span>Health</span><b>${c.stats.hp}</b></li>
            <li class="list-group-item bg-dark d-flex justify-content-between"><span>${c.partype}</span><b>${c.stats.mp}</b></li>
            <li class="list-group-item bg-dark d-flex justify-content-between"><span>Armor</span><b>${c.stats.armor}</b></li>
            <li class="list-group-item bg-dark d-flex justify-content-between"><span>Attack range</span><b>${c.stats.attackrange}</b></li>
            <li class="list-group-item bg-dark d-flex justify-content-between"><span>Move speed</span><b>${c.stats.movespeed}</b></li>
          </ul>

          <h4 class="text-danger border-bottom border-danger pb-2 mt-4 mb-3">Abilities</h4>
          ${abilities}
        `;
      } catch (error) {
        elDetails.innerHTML = '<div class="text-center text-danger py-5">Could not load this champion. Please go back and try again.</div>';
      }
    }

    getChampion();
  </script>
</body>

</html>
