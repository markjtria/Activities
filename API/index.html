<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Champions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <nav class="navbar bg-light border-bottom">
    <div class="container">
      <a class="navbar-brand" href="index.html">Champions</a>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row row-cols-3 row-cols-md-4 row-cols-lg-6 g-3" id="parent"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    var elParent = document.getElementById("parent");

    const loadChampions = async () => {
      elParent.innerHTML = '<div class="col-12 text-center py-5">Loading...</div>';
      try {
        const versionResponse = await fetch('https://ddragon.leagueoflegends.com/api/versions.json');
        const versions = await versionResponse.json();
        var version = versions[0];

        const response = await fetch('https://ddragon.leagueoflegends.com/cdn/' + version + '/data/en_US/champion.json');
        const result = await response.json();
        var champions = Object.values(result.data);

        elParent.innerHTML = '';
        for (var i = 0; i < champions.length; i++) {
          var c = champions[i];
          var image = 'https://ddragon.leagueoflegends.com/cdn/' + version + '/img/champion/' + c.image.full;

          elParent.innerHTML += `
            <div class="col">
              <div class="card text-center h-100">
                <img class="card-img-top" src="${image}" alt="${c.name}">
                <div class="card-body p-2">
                  <h6 class="card-title mb-0">${c.name}</h6>
                  <small class="text-secondary text-capitalize">${c.title}</small>
                </div>
              </div>
            </div>
          `;
        }
      } catch (error) {
        elParent.innerHTML = '<div class="col-12 text-center text-danger py-5">Could not load champions.</div>';
      }
    }

    loadChampions();
  </script>
</body>

</html>
