<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Champions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar bg-light border-bottom">
        <div class="container">
            <a class="navbar-brand" href="index.html">Champions</a>
            <input type="text" id="search" class="form-control ms-auto w-50" style="max-width: 300px;"
                placeholder="Search champion..." oninput="searchChampions()">
        </div>
    </nav>

    <div class="container py-4">
        <div class="row row-cols-3 row-cols-md-4 row-cols-lg-6 g-3" id="parent"></div>

        <div class="d-flex justify-content-center align-items-center gap-3 my-5">
            <button class="btn btn-primary" onclick="prev()">Previous</button>
            <div>Page <span id="currentpage">1</span> of <span id="totalpages">1</span></div>
            <button class="btn btn-primary" onclick="next()">Next</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        var elCurrentPage = document.getElementById("currentpage");
        var elTotalPages = document.getElementById("totalpages");
        var elParent = document.getElementById("parent");
        var elSearch = document.getElementById("search");

        var page = 1;
        var version = "";
        var allChampions = [];
        var shownChampions = [];
        var perPage = 18;
        var finalPage = 1;

        const loadChampions = async () => {
            elParent.innerHTML = '<div class="col-12 text-center py-5">Loading...</div>';
            try {
                const versionResponse = await fetch('https://ddragon.leagueoflegends.com/api/versions.json');
                const versions = await versionResponse.json();
                version = versions[0];

                const response = await fetch('https://ddragon.leagueoflegends.com/cdn/' + version + '/data/en_US/champion.json');
                const result = await response.json();

                allChampions = Object.values(result.data);
                shownChampions = allChampions;
                finalPage = Math.ceil(shownChampions.length / perPage);
                showChampions();
            } catch (error) {
                elParent.innerHTML = '<div class="col-12 text-center text-danger py-5">Could not load champions. Please refresh the page.</div>';
            }
        }

        function showChampions() {
            elParent.innerHTML = '';
            elCurrentPage.innerHTML = page;
            elTotalPages.innerHTML = finalPage;

            if (shownChampions.length == 0) {
                elParent.innerHTML = '<div class="col-12 text-center py-5">No champion found.</div>';
                return;
            }

            var start = (page - 1) * perPage;
            var end = Math.min(page * perPage, shownChampions.length);

            for (var i = start; i < end; i++) {
                var c = shownChampions[i];
                var image = 'https://ddragon.leagueoflegends.com/cdn/' + version + '/img/champion/' + c.image.full;

                elParent.innerHTML += `
          <div class="col">
            <a class="card h-100 text-center text-decoration-none" href="#">
              <img class="card-img-top" src="${image}" alt="${c.name}">
              <div class="card-body p-2">
                <h6 class="card-title mb-0">${c.name}</h6>
                <small class="text-secondary text-capitalize">${c.title}</small>
              </div>
            </a>
          </div>
        `;
            }
        }

        function searchChampions() {
            var text = elSearch.value.toLowerCase();
            shownChampions = allChampions.filter(function (c) {
                return c.name.toLowerCase().includes(text);
            });
            page = 1;
            finalPage = Math.max(1, Math.ceil(shownChampions.length / perPage));
            showChampions();
        }

        function prev() {
            page -= 1;
            if (page == 0) {
                page = finalPage;
            }
            showChampions();
        }

        function next() {
            page += 1;
            if (page > finalPage) {
                page = 1;
            }
            showChampions();
        }

        loadChampions();
    </script>
</body>

</html>
